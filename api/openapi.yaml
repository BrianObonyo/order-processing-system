openapi: 3.0.3
info:
  title: Order Processing System
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
paths:
  /api/v1/products:
    get:
      summary: List this tenant's products with live availability
      responses:
        "200":
          description: OK
  /api/v1/orders:
    get:
      summary: List tenant-scoped orders
      description: Regular users see their own orders; tenant admins see all orders for their tenant.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Page of orders, content: { application/json: { schema: { $ref: "#/components/schemas/OrderPage" } } } }
        "400": { description: Invalid pagination values }
    post:
      summary: Create an order
      description: Idempotent. Repeating a request with the same Idempotency-Key and body returns the original order.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "201": { description: Order created, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "200": { description: Replay of an earlier identical request (Idempotent-Replayed header set) }
        "400": { description: Invalid request or missing Idempotency-Key }
        "409": { description: Insufficient stock, or a request with this key is still in progress }
        "422": { description: Idempotency-Key reused with a different body, or unknown product }
  /api/v1/orders/{id}:
    get:
      summary: Get an order and its status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "404": { description: Not found }
  /api/v1/orders/{id}/cancel:
    post:
      summary: Cancel a pending order
      description: Releases reserved stock and records an order.cancelled event. Only pending orders can be cancelled.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Order cancelled }
        "404": { description: Not found }
        "409": { description: Order is no longer pending and cannot be cancelled }
  /api/v1/admin/orders:
    get:
      summary: List all orders for the authenticated tenant
      description: Requires an API key configured with the admin role.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200": { description: Tenant order page, content: { application/json: { schema: { $ref: "#/components/schemas/OrderPage" } } } }
        "403": { description: Admin role required }
        "400": { description: Invalid pagination values }
  /api/v1/admin/orders/{id}:
    get:
      summary: Get an order within the authenticated tenant
      description: Requires an API key configured with the admin role.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Order details, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "403": { description: Admin role required }
        "404": { description: Not found in this tenant }
  /api/v1/admin/orders/{id}/cancel:
    post:
      summary: Cancel a pending order in the authenticated tenant
      description: Requires an API key configured with the admin role.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Order cancelled }
        "403": { description: Admin role required }
        "404": { description: Not found in this tenant }
        "409": { description: Order is no longer pending }
  /api/v1/admin/orders/{id}/retry-payment:
    post:
      summary: Retry a declined payment attempt
      description: Requires an API key configured with the admin role. Only pending orders whose latest payment attempt was declined can be retried.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: Retry attempt queued }
        "403": { description: Admin role required }
        "404": { description: Order not found in this tenant }
        "409": { description: No declined payment attempt can be retried }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    OrderPage:
      type: object
      required: [orders, page, page_size, total]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/Order" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, format: int64 }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string }
        user_id: { type: string }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, CANCELLED] }
        total_cents: { type: integer, format: int64 }
        cancel_reason: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer }
              unit_price_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
