openapi: 3.0.3
info:
  title: Order Processing System
  version: 1.0.0
servers:
  - url: http://localhost:8080
security:
  - apiKey: []
paths:
  /api/v1/products:
    get:
      summary: List products with live availability
      responses:
        "200":
          description: OK
  /api/v1/orders:
    post:
      summary: Create an order
      description: Idempotent. Repeating a request with the same Idempotency-Key and body returns the original order.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "201": { description: Order created, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "200": { description: Replay of an earlier identical request (Idempotent-Replayed header set) }
        "400": { description: Invalid request or missing Idempotency-Key }
        "409": { description: Insufficient stock, or a request with this key is still in progress }
        "422": { description: Idempotency-Key reused with a different body, or unknown product }
  /api/v1/orders/{id}:
    get:
      summary: Get an order and its status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "404": { description: Not found }
components:
  securitySchemes:
    apiKey: { type: apiKey, in: header, name: X-API-Key }
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string }
        status: { type: string, enum: [PENDING_PAYMENT, PAID, CANCELLED] }
        total_cents: { type: integer, format: int64 }
        cancel_reason: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              quantity: { type: integer }
              unit_price_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
