name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.4" }
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: gofmt -l . | (! grep .)
      - run: go vet ./... && go vet -tags=integration ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: --timeout=5m
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - run: go test ./...
      - run: go test -race ./...
      # Docker is preinstalled on ubuntu runners, which Testcontainers needs.
      - run: go test -tags=integration -race -count=1 -timeout 10m ./tests/...
      - run: docker build --tag order-processing-system:ci .
